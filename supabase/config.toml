# Minimal local config. `supabase init` may add more defaults; keep these values.
project_id = "dental-platform"

[api]
enabled = true
port = 54321
schemas = ["public"]          # "private" is intentionally not exposed
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.external.google]
enabled = false               # optional later

[storage]
enabled = true
